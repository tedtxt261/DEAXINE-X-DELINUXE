<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DEaxinE.gpt</title>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    color: white;
    font-family: Arial;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

header {
    padding: 10px;
    text-align: center;
    font-size: 20px;
    background: #111;
    border-bottom: 1px solid #333;
}

#chatBox {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.msg {
    max-width: 70%;
    padding: 10px;
    margin: 8px;
    border-radius: 10px;
    animation: fadeIn 0.2s ease-in;
}

.user {
    background: #00ffcc;
    color: black;
    margin-left: auto;
}

.ai {
    background: #222;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(5px);}
    to {opacity: 1;}
}

#inputArea {
    display: flex;
    padding: 10px;
    background: #111;
}

input {
    flex: 1;
    padding: 10px;
    background: black;
    color: white;
    border: 1px solid #333;
}

button {
    padding: 10px;
    margin-left: 5px;
    background: #00ffcc;
    border: none;
    cursor: pointer;
}

#clearBtn {
    background: red;
    color: white;
}
</style>
</head>

<body>

<header>🤖 DEaxinE.gpt</header>

<div id="chatBox"></div>

<div id="inputArea">
    <input type="text" id="input" placeholder="Speak to DEaxinE..." />
    <button onclick="send()">Send</button>
    <button id="clearBtn" onclick="clearChat()">Clear</button>
</div>

<script>
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("input");

// LOAD HISTORY
let history = JSON.parse(localStorage.getItem("chatHistory")) || [];
history.forEach(m => addMsg(m.text, m.type));

// ENTER = SEND
input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") send();
});

function save() {
    localStorage.setItem("chatHistory", JSON.stringify(history));
}

function addMsg(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

async function send() {
    const text = input.value;
    if (!text) return;

    addMsg(text, "user");
    history.push({text, type:"user"});
    save();

    input.value = "";

    const loading = document.createElement("div");
    loading.className = "msg ai";
    loading.innerText = "DEaxinE is thinking...";
    chatBox.appendChild(loading);

    const res = await fetch("https://YOUR-BACKEND-URL/chat", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({message:text})
    });

    const data = await res.json();
    loading.remove();

    typeEffect(data.reply);
}

function typeEffect(text) {
    let i = 0;
    let current = "";
    const div = document.createElement("div");
    div.className = "msg ai";
    chatBox.appendChild(div);

    const interval = setInterval(() => {
        current += text[i];
        div.innerText = current;
        chatBox.scrollTop = chatBox.scrollHeight;
        i++;
        if (i >= text.length) {
            clearInterval(interval);
            history.push({text, type:"ai"});
            save();
        }
    }, 20);
}

function clearChat() {
    localStorage.removeItem("chatHistory");
    chatBox.innerHTML = "";
    history = [];
}
</script>

</body>
</html>
